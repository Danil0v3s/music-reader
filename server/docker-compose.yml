# docker compose -f server/docker-compose.yml up -d --build
# Settings go in a .env next to this file (see .env.example): the public address, sign-in providers, email.
services:
  omr:
    build: .
    platform: linux/amd64
    image: music-reader-omr
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      OMR_PUBLIC_URL: ${OMR_PUBLIC_URL:-http://localhost:8765}
      OMR_APPLE_AUDIENCE: ${OMR_APPLE_AUDIENCE:-br.com.firstsoft.musicreader}
      OMR_GOOGLE_CLIENT_IDS: ${OMR_GOOGLE_CLIENT_IDS:-}
      OMR_APPLE_TEAM_ID: ${OMR_APPLE_TEAM_ID:-}
      OMR_APPLE_KEY_ID: ${OMR_APPLE_KEY_ID:-}
      OMR_APPLE_PRIVATE_KEY_FILE: ${OMR_APPLE_PRIVATE_KEY_FILE:-}
      OMR_SMTP_HOST: ${OMR_SMTP_HOST:-}
      OMR_SMTP_PORT: ${OMR_SMTP_PORT:-587}
      OMR_SMTP_USER: ${OMR_SMTP_USER:-}
      OMR_SMTP_PASSWORD: ${OMR_SMTP_PASSWORD:-}
      OMR_MAIL_FROM: ${OMR_MAIL_FROM:-Music Reader <no-reply@localhost>}
      OMR_TRUST_PROXY: ${OMR_TRUST_PROXY:-0}
      OMR_TIMEOUT: ${OMR_TIMEOUT:-900}
      OMR_FINGERINGS: ${OMR_FINGERINGS:-0}
    volumes:
      - omr-data:/data
    # Audiveris on a dense multi-page score can use several GB.
    mem_limit: 4g

  # HTTPS on a public address: OMR_DOMAIN=music.example.com in .env, then
  #   docker compose --profile public up -d
  # (and set OMR_TRUST_PROXY=1, OMR_PUBLIC_URL=https://<domain>; drop the 8765 port mapping above, or firewall it).
  caddy:
    image: caddy:2.8
    profiles: [public]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      OMR_DOMAIN: ${OMR_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [omr]

volumes:
  omr-data:
  caddy-data:
